<header class="header">
  <h1>Tienda Online</h1>
 
  <nav class="links">
    <a routerLink="/">Productos</a>
    <a routerLink="/usuario">Mi cuenta</a>

    @if (auth.isAdmin()) {
      <a routerLink="/admin">Admin</a>
    }
 
    @if (auth.isAuthenticated()) {
      <span>{{ auth.username() }}</span>
      <button (click)="salir()">Salir</button>
    } @else {
      <a routerLink="/login">Ingresar</a>
    }
  </nav>
</header>
